[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-provider-runtime"
version = "0.1.0"
description = "Local provider-isolated Codex App Servers and task communication"
requires-python = ">=3.11"
dependencies = ["websockets>=14,<17", "wsproto>=1.2,<2", "psutil>=6,<8"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
cpr = "codex_provider_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
